# Тести на кожен push і на кожен pull request.
#
# Досі їх запускала людина — тобто ніхто. Написані вони були, лежали
# в репозиторії, і жоден із них не заважав залити зламане: щоб дізнатись
# про поломку, треба було спершу згадати про існування `npm test`.
#
# Тепер це робить GitHub. Складання перевіряємо тут же: збірка ловить
# інше — обірвані імпорти й синтаксис, — і разом вони дають ту перевірку,
# яку раніше доводилось проводити руками перед кожним промоутом.

name: Тести

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # та сама версія, на якій застосунок працює на Vercel
          node-version: '22'
          cache: npm

      - name: Встановити залежності
        run: npm ci

      - name: Тести
        run: npm test

      # Збірка ходить у мережу лише за пакунками, які вже встановлені,
      # і не звертається до таблиць: ключі їй тут не потрібні.
      - name: Складання
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
